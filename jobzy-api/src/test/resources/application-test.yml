spring:
  datasource:
    url: jdbc:h2:mem:jobzy;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  ai:
    mistralai:
      # Tests never call Mistral: the generator is mocked in integration tests and the adapter test
      # points this at WireMock. An unreachable default makes an accidental real call fail fast.
      # The chat client has its own base URL that defaults to api.mistral.ai and wins over
      # spring.ai.mistralai.base-url, so it is the one to override.
      api-key: test-key
      chat:
        base-url: http://localhost:1

jobzy:
  scheduling:
    # Scheduled jobs are tested by calling their use case directly.
    enabled: false

logging:
  level:
    app.jobzy: DEBUG
