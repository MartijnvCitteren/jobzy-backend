server:
  port: 8090
  servlet:
    context-path: /api/v1
spring:
  application:
    name: "Jobzy"
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:default}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        completions-path: v1/chat/completions
        options:
          model: gpt-5.2

jobzy:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  identity:
    # Frontend page the verification mail links to; the token is appended as ?token=...
    confirmation-url: ${IDENTITY_CONFIRMATION_URL:https://jobzy.app/registration/confirm}
    # How long a verification link stays valid before the unconfirmed registration is purged.
    unconfirmed-retention: ${IDENTITY_UNCONFIRMED_RETENTION:PT48H}
    purge-interval: ${IDENTITY_PURGE_INTERVAL:PT1H}

logging:
  level:
    app.jobzy: ${LOGGING_LEVEL_APP:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
